<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="refresh" content="600">
<title>Jet7 fleet</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #2C3F54; --navy-deep: #1f2e3e; --gold: #BCA67B;
    --paper: #fbfaf7; --ink: #22303f; --muted: #7b8591; --line: #e3ded3;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 14px/1.45 Poppins, system-ui, sans-serif; color: var(--ink);
    background: var(--paper); display: grid;
    grid-template: "head head" auto "list map" 1fr / 300px 1fr;
    padding-top: env(safe-area-inset-top, 0px);
  }
  header {
    grid-area: head; position: relative; overflow: hidden; color: #fff;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    padding: 14px 24px;
    background: linear-gradient(115deg, #17222f 0%, var(--navy) 55%, #3a5068 100%);
    border-bottom: 2px solid var(--gold);
  }
  .brand { display: flex; align-items: center; gap: 14px; position: relative; z-index: 1; }
  .mark { width: 40px; height: 40px; padding: 8px; border: 1.5px solid var(--gold);
    border-radius: 50%; transform: rotate(45deg); flex: none; }
  header h1 { font: 600 27px/1 Lora, Georgia, serif; margin: 0; letter-spacing: .02em; }
  header h1 span { color: var(--gold); font-weight: 500; font-style: italic; }
  .sub { margin: 5px 0 0; font-size: 12px; color: rgba(255,255,255,.65); }
  .stats { display: flex; gap: 28px; position: relative; z-index: 1; }
  .stat { display: flex; flex-direction: column; align-items: flex-end; }
  .stat b { font: 600 24px/1 Lora, Georgia, serif; color: var(--gold); }
  .stat small { font-size: 11px; color: rgba(255,255,255,.7); margin-top: 5px; }
  .stat.time b { color: #fff; font: 500 16px/1.5 Poppins, sans-serif; }
  .contrail { position: absolute; right: -40px; top: -20px; width: 560px; height: 130px;
    opacity: .22; pointer-events: none; }
  #list { grid-area: list; overflow-y: auto; border-right: 1px solid var(--line); }
  #map { grid-area: map; }
  .ac {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    border-bottom: 1px solid var(--line); padding: 14px 20px; cursor: pointer;
    font: inherit; color: inherit;
  }
  .ac:hover, .ac:focus-visible { background: #f2eee5; outline: none; }
  .ac:focus-visible { box-shadow: inset 3px 0 0 var(--gold); }
  .ac .tail { font: 600 18px/1.2 Lora, Georgia, serif; }
  .ac .state { font-size: 13px; margin-top: 2px; }
  .ac .state.airborne { color: var(--navy); }
  .ac .state.unknown, .ac .state.last_seen { color: var(--muted); }
  .ac .detail { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .ac[disabled] { cursor: default; }
  .tail-label {
    background: var(--navy); color: #fff; border: 1px solid var(--gold);
    font: 500 12px Poppins, sans-serif; padding: 2px 6px; box-shadow: none;
  }
  .tail-label::before { display: none; }
  .dest-label { background: #fff; color: var(--navy); border: 1px solid var(--navy);
    font: 500 11px Poppins, sans-serif; box-shadow: none; }
  .legend { background: rgba(255,255,255,.92); padding: 8px 10px; font-size: 12px;
    border: 1px solid var(--line); line-height: 1.7; }
  .legend i { display: inline-block; width: 22px; height: 0; vertical-align: middle;
    margin-right: 6px; border-top: 3px solid var(--gold); }
  .legend i.dash { border-top: 2px dashed var(--navy); }
  @media (max-width: 720px) {
    body { grid-template: "head" auto "map" 58vh "list" 1fr / 1fr; }
    #list { border-right: 0; border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom, 0px); }
    header { flex-direction: column; align-items: flex-start; gap: 14px; }
    .stats { gap: 22px; }
    .stat { align-items: flex-start; }
  }
</style>
</head>
<body>
<header>
  <svg class="contrail" viewBox="0 0 560 130" aria-hidden="true">
    <path d="M0 118 C 180 108, 330 58, 560 8" stroke="#BCA67B" stroke-width="2" fill="none"/>
    <path d="M0 128 C 190 118, 340 70, 560 22" stroke="#BCA67B" stroke-width="1" fill="none"/>
  </svg>
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c.8 0 1.3.9 1.3 2v5.2l7.7 4.5v2l-7.7-2.4v4.5l2.2 1.7v1.5L12 20l-3.5 1v-1.5l2.2-1.7v-4.5L3 15.7v-2l7.7-4.5V4c0-1.1.5-2 1.3-2z" fill="#BCA67B"/></svg>
    <div>
      <h1>Jet7 <span>Charters</span></h1>
      <p class="sub">Live fleet tracker</p>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><b id="n-total">&ndash;</b><small>aircraft</small></div>
    <div class="stat"><b id="n-air">&ndash;</b><small>in the air</small></div>
    <div class="stat time"><b id="upd-time">&ndash;</b><small id="upd-date">last update</small></div>
  </div>
</header>
<nav id="list" aria-label="Aircraft"></nav>
<div id="map" role="region" aria-label="Fleet map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const FLEET = {"updated": "Fri Oct 16, 12:28 PM EDT", "aircraft": [{"tail": "N936AM", "icao24": "acfbff", "status": "airborne", "track": [[36.955, -119.5753], [36.9557, -119.5735], [36.9856, -119.4947], [37.0164, -119.414], [37.0469, -119.3334], [37.0632, -119.2903], [37.0865, -119.2286], [37.1109, -119.1635], [37.1264, -119.1219], [37.1504, -119.0581], [37.1742, -118.9947], [37.2072, -118.9065], [37.2298, -118.8454], [37.2554, -118.7772], [37.2637, -118.7527], [37.2701, -118.7288], [37.2753, -118.7041], [37.2788, -118.6815], [37.2815, -118.6569], [37.2868, -118.5866], [37.2912, -118.53], [37.2963, -118.4615], [37.3016, -118.3926], [37.3071, -118.3209], [37.3126, -118.2479], [37.3173, -118.1864], [37.322, -118.1238], [37.3284, -118.0317], [37.3349, -117.9414], [37.3456, -117.796], [37.3594, -117.5892], [37.3605, -117.565], [37.3605, -117.5416], [37.3596, -117.5189], [37.3581, -117.4973], [37.3553, -117.4723], [37.3523, -117.4517], [37.3478, -117.428], [37.3419, -117.4025], [37.3355, -117.3792], [37.3287, -117.3579], [37.3216, -117.3384], [37.3124, -117.3158], [37.3025, -117.2945], [37.2913, -117.273], [37.2812, -117.2555], [37.2689, -117.2363], [37.2547, -117.2164], [37.2415, -117.1996], [37.2256, -117.1815], [37.2111, -117.1667], [37.1941, -117.151], [37.1761, -117.1361], [37.1557, -117.1213], [37.0955, -117.083], [37.0365, -117.0454], [36.8985, -116.9581], [36.86, -116.9339], [36.8401, -116.9202], [36.8226, -116.906], [36.8067, -116.8908], [36.7929, -116.8758], [36.7787, -116.858], [36.7643, -116.8373], [36.7532, -116.8188], [36.7407, -116.7943], [36.7318, -116.7736], [36.7225, -116.7486], [36.6842, -116.6417], [36.3412, -115.7045], [36.334, -115.6805], [36.3276, -115.6543], [36.3232, -115.6324], [36.319, -115.6047], [36.3163, -115.5789], [36.0922, -113.2815], [35.9299, -111.8531]], "last_contact": 1792168122, "lon": -111.848, "lat": 35.9293, "alt_ft": 44950, "on_ground": false, "speed_kt": 454, "heading": 98.49, "origin": {"code": "CL24", "name": "Kindsvater Ranc 1.3099, "lat": 32.8757, "alt_ft": 31975, "on_ground": false, "speed_kt": 385, "heading": 168.02, "origin": {"code": "BKL", "name": "Burke Lakefront Airport", "lat": 41.5175, "lon": -81.6833, "km": 2.6}, "departed": "Fri 10:51 AM"}, {"tail": "N560PA", "icao24": "a72830", "status": "airborne", "track": [[33.5792, -83.2751], [33.5792, -83.2751], [33.5801, -83.3083], [33.5813, -83.3583], [33.5815, -83.3705], [33.5815, -83.3829], [33.5791, -83.3944], [33.5718, -83.4063], [33.5624, -83.4137], [33.5494, -83.4178], [33.5377, -83.4179], [33.4712, -83.412], [33.4298, -83.4071], [33.3763, -83.3994], [33.3341, -83.3927], [33.2752, -83.383], [33.2615, -83.383], [33.2498, -83.3872], [33.2381, -83.3973], [33.2309, -83.4102], [33.2276, -83.4269], [33.2266, -83.4411], [33.226, -83.4551], [33.225, -83.4825], [33.2237, -83.526], [33.2212, -83.5669], [33.2203, -83.5796], [33.219, -83.5932], [33.2165, -83.6079], [33.2137, -83.6218], [33.2079, -83.6498], [33.1999, -83.6928], [33.1455, -83.9927], [33.1272, -84.0917], [33.1151, -84.1568], [33.1059, -84.2065], [33.0974, -84.2521], [33.0835, -84.3264], [33.0698, -84.3998], [33.0522, -84.4939], [33.0401, -84.5577], [33.0191, -84.6684], [32.9963, -84.7883], [32.9743, -84.9032], [32.9444, -85.0581], [32.5994, -86.7751], [32.5567, -86.9784]], "last_contact": 1792168121, "lon": -86.9812, "lat": 32.5562, "alt_ft": 35950, "on_ground": false, "speed_kt": 375, "heading": 255.96, "origin": {"code": "GA65", "name": "Home Field", "lat": 33.6079, "lon": -83.3553, "km": 8.1}, "departed": "Fri 11:47 AM"}, {"tail": "N560WV", "icao24": "a728f2", "status": "last_seen", "track": [], "lat": 33.9388, "lon": -81.1195, "airport": {"code": "CAE", "name": "Columbia Metropolitan Airport", "lat": 33.9382, "lon": -81.123, "km": 0.3}, "seen": "Sun 3:55 PM", "was_airborne": false}, {"tail": "N50XY", "icao24": "a639bb", "status": "last_seen", "track": [], "lat": 37.2578, "lon": -79.9499, "airport": {"code": "ROA", "name": "Roanoke\u2013Blacksburg Regional Airport", "lat": 37.3255, "lon": -79.9754, "km": 7.9}, "seen": "Thu 8:34 PM", "was_airborne": true}, {"tail": "N156RE", "icao24": "a0e1f5", "status": "last_seen", "track": [], "lat": 33.8484, "lon": -84.2073, "airport": {"code": "PDK", "name": "DeKalb Peachtree Airport", "lat": 33.8763, "lon": -84.3021, "km": 9.3}, "seen": "Thu 9:29 PM", "was_airborne": true}]};

const [updDate, updTime] = FLEET.updated.split(", ");
document.getElementById("n-total").textContent = FLEET.aircraft.length;
document.getElementById("n-air").textContent = FLEET.aircraft.filter(a => a.status === "airborne").length;
document.getElementById("upd-time").textContent = updTime || FLEET.updated;
document.getElementById("upd-date").textContent = updTime ? "updated " + updDate : "last update";

const map = L.map("map", { worldCopyJump: true, zoomControl: true });
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18,
  attribution: '&copy; OpenStreetMap contributors | Positions: OpenSky Network'
}).addTo(map);

function planeIcon(heading, ground) {
  const fill = ground ? "#7b8591" : "#2C3F54";
  return L.divIcon({
    className: "", iconSize: [30, 30], iconAnchor: [15, 15],
    html: `<svg width="30" height="30" viewBox="0 0 24 24" style="transform:rotate(${heading || 0}deg)">
      <path d="M12 2c.8 0 1.3.9 1.3 2v5.2l7.7 4.5v2l-7.7-2.4v4.5l2.2 1.7v1.5L12 20l-3.5 1v-1.5l2.2-1.7v-4.5L3 15.7v-2l7.7-4.5V4c0-1.1.5-2 1.3-2z"
        fill="${fill}" stroke="#BCA67B" stroke-width="1"/></svg>`
  });
}

const bounds = [];
const list = document.getElementById("list");

const order = { airborne: 0, on_ground: 1, last_seen: 2, unknown: 3 };
FLEET.aircraft.sort((a, b) => order[a.status] - order[b.status]);
const at = ap => (ap.km > 3 ? "near " : "at ") + ap.code;

for (const a of FLEET.aircraft) {
  const btn = document.createElement("button");
  btn.className = "ac";
  let state, lines = [];
  if (a.status === "airborne") {
    state = a.origin ? `In the air, departed ${a.origin.code}` : "In the air";
    const alt = a.alt_ft != null ? a.alt_ft.toLocaleString() : "–";
    lines.push(`${alt} ft, ${a.speed_kt ?? "–"} kt${a.departed ? ", took off " + a.departed : ""}`);
  } else if (a.status === "on_ground") {
    state = `On the ground ${at(a.airport)}`;
    lines.push(a.airport.name);
  } else if (a.status === "last_seen") {
    state = a.was_airborne ? `Out of coverage, last seen in the air near ${a.airport.code}`
                           : `Parked ${at(a.airport)}`;
    lines.push(`${a.airport.name}, last signal ${a.seen}`);
  } else {
    state = "No recent data";
  }
  const mappable = a.lat != null;
  if (!mappable) btn.disabled = true;
  btn.innerHTML = `<div class="tail">${a.tail}</div>
    <div class="state ${a.status}">${state}</div>
    ${lines.map(l => `<div class="detail">${l}</div>`).join("")}`;
  list.appendChild(btn);
  if (!mappable) continue;

  const group = L.layerGroup().addTo(map);
  const pos = [a.lat, a.lon];
  bounds.push(pos);
  const flying = a.status === "airborne";

  if (flying && a.track.length > 1) {
    L.polyline(a.track, { color: "#BCA67B", weight: 3 }).addTo(group);
    L.circleMarker(a.track[0], { radius: 4, color: "#2C3F54", fillColor: "#fff",
      fillOpacity: 1, weight: 2 }).bindTooltip(`${a.tail} departed ${a.origin ? a.origin.code : ""}`).addTo(group);
  }
  // Parked aircraft at the same airport get nudged apart so labels don't stack.
  const same = FLEET.aircraft.filter(b => b.status !== "airborne" && b.airport && a.airport && b.airport.code === a.airport.code);
  const k = same.indexOf(a);
  const shown = (!flying && same.length > 1)
    ? [a.lat + 0.08 * Math.cos(k * 2 * Math.PI / same.length), a.lon + 0.1 * Math.sin(k * 2 * Math.PI / same.length)]
    : pos;
  L.marker(shown, { icon: planeIcon(flying ? a.heading : 0, !flying) })
    .bindTooltip(a.tail, { permanent: true, direction: "top", offset: [0, -14], className: "tail-label" })
    .addTo(group);
  btn.addEventListener("click", () => map.setView(pos, flying ? 7 : 10));
}

if (bounds.length) map.fitBounds(bounds, { padding: [50, 50], maxZoom: 8 });
else map.setView([33.0, -80.0], 5);

const legend = L.control({ position: "bottomleft" });
legend.onAdd = () => {
  const d = L.DomUtil.create("div", "legend");
  d.innerHTML = '<div><i></i>Flown track</div>';
  return d;
};
legend.addTo(map);
</script>
</body>
</html>
