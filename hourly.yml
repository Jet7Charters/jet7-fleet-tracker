name: Jet7 fleet hourly update

on:
  schedule:
    - cron: "0 * * * *"   # top of every hour (GitHub may run a few minutes late)
  workflow_dispatch:       # "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch positions, build map, send updates
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          LOCAL_TZ: ${{ secrets.LOCAL_TZ }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          SMS_TO: ${{ secrets.SMS_TO }}
          PAGE_URL: ${{ secrets.PAGE_URL }}
        run: python tracker.py
      - name: Publish updated map
        run: |
          git config user.name "jet7-tracker"
          git config user.email "tracker@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Fleet update $(date -u +%H:%MZ)"
          git push
